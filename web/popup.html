<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Todo List</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    #todo-input {
      width: 70%;
      padding: 8px;
      margin-right: 5px;
    }
    button {
      padding: 8px 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin-top: 15px;
    }
    li {
      padding: 8px;
      margin: 5px 0;
      background-color: #f5f5f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background-color: #ff4444;
    }
  </style>
</head>
<body>
  <div>
    <input type="text" id="todo-input" placeholder="输入新任务...">
    <button id="add-btn">添加</button>
  </div>
  <ul id="todo-list"></ul>

  <script src="popup.js" type="module"></script>
</body>
</html>
